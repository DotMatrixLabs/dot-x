name: Feature request
description: Suggest an idea for Dot X
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first, including closed ones, in case this came up before.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you want Dot X to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you found to work around this, if any.
