name: Linux CI

on:
  push:
    branches:
      - main
      - linux-support
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-24.04

    env:
      CARGO_TERM_COLOR: always
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Rust path dependencies
        shell: bash
        run: |
          git clone --depth 1 https://github.com/Frogbyte-io/volume-control-rs.git ../volume-control-rs
          git clone --depth 1 https://github.com/Frogbyte-io/psp.git ../psp

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl wget file \
            libwebkit2gtk-4.1-dev librsvg2-dev libgtk-3-dev \
            libxcb-ewmh-dev libxcb-randr0-dev libdbus-1-dev \
            libpulse-dev libudev-dev libasound2-dev \
            libayatana-appindicator3-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/libsoup-3.0.pc \
            /usr/lib/x86_64-linux-gnu/pkgconfig/soup-3.0.pc

      - name: Install Rust tooling
        run: cargo install cargo-license --version 0.7.0 --locked

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build

      - name: Build Tauri app
        run: yarn tauri build --no-bundle

      - name: Build Linux bundles
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: yarn tauri build
