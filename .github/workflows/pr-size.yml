name: PR Size

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main, v2]
    paths:
      - .github/workflows/pr-size.yml

permissions:
  contents: read

jobs:
  sync-label-definitions:
    name: Sync PR size label definitions
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Ensure PR size labels exist
        uses: actions/github-script@v8
        with:
          script: |
            const managedLabels = [
              {
                name: "size:XS",
                color: "0e8a16",
                description: "0-9 changed lines.",
              },
              {
                name: "size:S",
                color: "5ebd3e",
                description: "10-29 changed lines.",
              },
              {
                name: "size:M",
                color: "fbca04",
                description: "30-99 changed lines.",
              },
              {
                name: "size:L",
                color: "fe7d37",
                description: "100-499 changed lines.",
              },
              {
                name: "size:XL",
                color: "d93f0b",
                description: "500-999 changed lines.",
              },
              {
                name: "size:XXL",
                color: "b60205",
                description: "1,000+ changed lines.",
              },
            ];

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (existing.color !== label.color || (existing.description ?? "") !== label.description) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

  label:
    name: Label PR size
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: write
    concurrency:
      group: pr-size-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # This pull_request_target job may fetch untrusted PR commits only as passive
      # git data. Do not add dependency installs, build/test scripts, or cache
      # actions here; use pull_request (CI) for that instead.
      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync PR size label
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require("node:child_process");

            const managedLabels = [
              { name: "size:XS", color: "0e8a16", description: "0-9 changed lines." },
              { name: "size:S", color: "5ebd3e", description: "10-29 changed lines." },
              { name: "size:M", color: "fbca04", description: "30-99 changed lines." },
              { name: "size:L", color: "fe7d37", description: "100-499 changed lines." },
              { name: "size:XL", color: "d93f0b", description: "500-999 changed lines." },
              { name: "size:XXL", color: "b60205", description: "1,000+ changed lines." },
            ];

            const managedLabelNames = new Set(managedLabels.map((label) => label.name));

            for (const label of managedLabels) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });

                if (existing.color !== label.color || (existing.description ?? "") !== label.description) {
                  await github.rest.issues.updateLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            const issueNumber = context.payload.pull_request.number;
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const headTrackingRef = `refs/remotes/pr-size/${issueNumber}`;

            const sumNumstat = (text) =>
              text
                .split("\n")
                .filter(Boolean)
                .reduce((total, line) => {
                  const [insertionsRaw = "0", deletionsRaw = "0"] = line.split("\t");
                  const additions = insertionsRaw === "-" ? 0 : Number.parseInt(insertionsRaw, 10) || 0;
                  const deletions = deletionsRaw === "-" ? 0 : Number.parseInt(deletionsRaw, 10) || 0;

                  return total + additions + deletions;
                }, 0);

            const resolveSizeLabel = (totalChangedLines) => {
              if (totalChangedLines < 10) return "size:XS";
              if (totalChangedLines < 30) return "size:S";
              if (totalChangedLines < 100) return "size:M";
              if (totalChangedLines < 500) return "size:L";
              if (totalChangedLines < 1000) return "size:XL";
              return "size:XXL";
            };

            execFileSync("git", ["fetch", "--no-tags", "origin", baseSha], {
              stdio: "inherit",
            });

            execFileSync(
              "git",
              ["fetch", "--no-tags", "origin", `+refs/pull/${issueNumber}/head:${headTrackingRef}`],
              {
                stdio: "inherit",
              },
            );

            const resolvedHeadSha = execFileSync("git", ["rev-parse", headTrackingRef], {
              encoding: "utf8",
            }).trim();

            if (resolvedHeadSha !== headSha) {
              core.warning(
                `Fetched head SHA ${resolvedHeadSha} does not match pull request head SHA ${headSha}; using fetched ref for sizing.`,
              );
            }

            execFileSync("git", ["cat-file", "-e", `${baseSha}^{commit}`], {
              stdio: "inherit",
            });

            const totalChangedLines = sumNumstat(
              execFileSync(
                "git",
                [
                  "diff",
                  "--numstat",
                  "--ignore-all-space",
                  "--ignore-blank-lines",
                  `${baseSha}...${resolvedHeadSha}`,
                ],
                { encoding: "utf8" },
              ),
            );

            const nextLabelName = resolveSizeLabel(totalChangedLines);

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            for (const label of currentLabels) {
              if (!managedLabelNames.has(label.name) || label.name === nextLabelName) {
                continue;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: label.name,
                });
              } catch (removeError) {
                if (removeError.status !== 404) {
                  throw removeError;
                }
              }
            }

            if (!currentLabels.some((label) => label.name === nextLabelName)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [nextLabelName],
              });
            }

            core.info(`PR #${issueNumber}: ${totalChangedLines} changed lines -> ${nextLabelName}`);
