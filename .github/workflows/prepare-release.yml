name: Prepare Dot X release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      publish_prerelease:
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: dot-x-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release draft
    runs-on: windows-latest
    # Holds the code signing secrets. Its deployment rules admit main (which nightly
    # betas run from) and stable tags like v2.0.0, never prerelease tags.
    environment: signing
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Check tag and source branch
        shell: pwsh
        env:
          BETA_SOURCE_SHA: ${{ inputs.source_sha }}
          PUBLISH_PRERELEASE: ${{ inputs.publish_prerelease || false }}
        run: |
          git fetch origin main
          $source = 'HEAD'
          if ($env:PUBLISH_PRERELEASE -eq 'true') {
            if ($env:BETA_SOURCE_SHA -notmatch '^[a-f0-9]{40}$' -or (git rev-parse HEAD^) -ne $env:BETA_SOURCE_SHA) {
              throw 'Beta version commit must directly follow its selected main commit.'
            }
            $allowed = @('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'src-tauri/tauri.conf.json')
            $unexpected = @(git diff --name-only HEAD^ HEAD | Where-Object { $_ -notin $allowed })
            if ($unexpected.Count) { throw 'Beta tag contains changes beyond release version files.' }
            $source = $env:BETA_SOURCE_SHA
          }
          git merge-base --is-ancestor $source origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must point to a commit on main."
          }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match app version $version."
          }

      # src-tauri depends on ../../volume-control-rs by path on every platform.
      - name: Check out volume-control-rs
        shell: bash
        run: |
          git clone --quiet https://github.com/Frogbyte-io/volume-control-rs.git ../volume-control-rs
          git -C ../volume-control-rs checkout --quiet 29594c46a4c1da9c1075cc8beb283d13f4799aca

      - name: Require updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Set TAURI_SIGNING_PRIVATE_KEY to the private key matching src-tauri/tauri.conf.json."
          }

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck and build frontend
        run: |
          yarn typecheck
          yarn build:web

      - name: Fetch bundled Deno runtime
        run: yarn fetch-deno

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Install license generator
        run: cargo install cargo-license --version 0.7.0 --locked

      # The code signing certificate lives on a USB token in the signer VM. The runner
      # joins the tailnet as tag:ci, which may only reach SSH on the signer, and the
      # signer's key for this runner may only run its signing command.
      - name: Join the tailnet to reach the signer
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: signer.tail5b493.ts.net

      - name: Set up Authenticode signing
        shell: pwsh
        env:
          SIGNER_SSH_KEY: ${{ secrets.SIGNER_SSH_KEY }}
        run: |
          if (-not $env:SIGNER_SSH_KEY) { throw 'Set SIGNER_SSH_KEY in the signing environment.' }
          $ssh = New-Item -ItemType Directory -Force "$HOME\.ssh"
          $key = Join-Path $ssh 'signer'
          Set-Content -LiteralPath $key -Value ($env:SIGNER_SSH_KEY.Trim() + "`n") -NoNewline
          icacls $key /inheritance:r /grant:r "${env:USERNAME}:F" | Out-Null
          Add-Content -LiteralPath (Join-Path $ssh 'known_hosts') 'signer.tail5b493.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJJ9xPetVCWOsWgMELMkMRMn05FojRmYo/1mRQKB0ML8'
          "SIGNER_HOST=svc_signing@signer.tail5b493.ts.net" >> $env:GITHUB_ENV

          # Only release builds sign, so the sign command is passed with --config
          # instead of living in tauri.conf.json.
          $config = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = 'pwsh'
            args = @('-NoProfile', '-NonInteractive', '-File', "$PWD\tools\sign-windows.ps1", '%1')
          } } } }
          $config | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP\dotx-signing.json"

      - name: Build signed updater artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOTX_SENTRY_DSN: ${{ secrets.DOTX_SENTRY_DSN }}
          DOTX_APTABASE_KEY: ${{ secrets.DOTX_APTABASE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STATS_SECRET_KEY: ${{ secrets.VITE_STATS_SECRET_KEY }}
        with:
          tauriScript: yarn tauri
          args: --bundles nsis --config ${{ runner.temp }}\dotx-signing.json

      - name: Upload and verify Windows release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release-assets.mjs windows

      - name: Check draft updater metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseDir = Join-Path $env:RUNNER_TEMP 'dotx-release'
          New-Item -ItemType Directory -Path $releaseDir | Out-Null
          gh release download $env:RELEASE_TAG --pattern latest.json --dir $releaseDir
          if ($LASTEXITCODE -ne 0) { throw 'Draft release has no latest.json.' }

          $metadata = Get-Content (Join-Path $releaseDir 'latest.json') -Raw | ConvertFrom-Json
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($metadata.version.TrimStart('v') -ne $version) {
            throw "Updater metadata version $($metadata.version) does not match $version."
          }
          $windows = $metadata.platforms.'windows-x86_64'
          if (-not $windows.url -or -not $windows.signature) {
            throw 'Updater metadata has no Windows x64 URL or signature.'
          }

          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $publicKeyText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($config.plugins.updater.pubkey))
          $signatureText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($windows.signature))
          $publicKeyLine = $publicKeyText -split '\r?\n' | Where-Object { $_ -match '^[A-Za-z0-9+/=]{40,}$' } | Select-Object -First 1
          $signatureLine = $signatureText -split '\r?\n' | Where-Object { $_ -match '^[A-Za-z0-9+/=]{80,}$' } | Select-Object -First 1
          if (-not $publicKeyLine -or -not $signatureLine) {
            throw 'Updater public key or signature has an invalid minisign format.'
          }
          $publicKeyBytes = [Convert]::FromBase64String($publicKeyLine)
          $signatureBytes = [Convert]::FromBase64String($signatureLine)
          if ($publicKeyBytes.Length -lt 10 -or $signatureBytes.Length -lt 10 -or
              [BitConverter]::ToString($publicKeyBytes, 2, 8) -ne [BitConverter]::ToString($signatureBytes, 2, 8)) {
            throw 'Updater signature key does not match the public key bundled with Dot X.'
          }

          $assets = @(gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list draft release assets.' }
          $bundleUrl = [uri]$windows.url
          $bundleName = [uri]::UnescapeDataString([IO.Path]::GetFileName($bundleUrl.AbsolutePath))
          if ($bundleUrl.Host -ne 'github.com' -or $bundleUrl.AbsolutePath -notlike "*/releases/download/$env:RELEASE_TAG/*") {
            throw 'Updater bundle URL does not point to this release tag.'
          }
          if ($bundleName -notlike '*.nsis.zip' -or $assets -notcontains $bundleName) {
            throw 'Updater bundle is missing from the draft release.'
          }
          if ($assets -notcontains "$bundleName.sig" -or -not ($assets | Where-Object { $_ -like '*setup.exe' })) {
            throw 'Updater signature or NSIS installer is missing from the draft release.'
          }

  linux:
    name: Add Linux builds to the release draft
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      # src-tauri depends on ../../volume-control-rs by path on every platform.
      - name: Check out volume-control-rs
        shell: bash
        run: |
          git clone --quiet https://github.com/Frogbyte-io/volume-control-rs.git ../volume-control-rs
          git -C ../volume-control-rs checkout --quiet 29594c46a4c1da9c1075cc8beb283d13f4799aca

      - name: Install Linux build dependencies
        run: bash scripts/install-linux-deps.sh

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: yarn

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install license generator
        run: cargo install cargo-license --version 0.7.0 --locked

      # Builds the .deb and AppImage without updater artifacts (no signing key in this
      # step) and repacks the AppImage without bundled libwayland; see LINUX-SUPPORT.md.
      - name: Build Linux bundles
        run: yarn build:linux

      # The repack changes the AppImage, so it is signed here rather than by tauri build.
      - name: Sign the AppImage for the updater
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          out="$RUNNER_TEMP/dotx-linux"
          mkdir -p "$out"
          cp src-tauri/target/release/bundle/deb/*.deb "$out/Dot.X_${version}_amd64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "$out/Dot.X_${version}_amd64.AppImage"
          yarn -s tauri signer sign "$out/Dot.X_${version}_amd64.AppImage" < /dev/null

      - name: Upload Linux assets and add them to latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          out="$RUNNER_TEMP/dotx-linux"
          appimage="Dot.X_${version}_amd64.AppImage"
          node tools/release-assets.mjs upload "$out/Dot.X_${version}_amd64.deb" "$out/$appimage" "$out/$appimage.sig"

          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$out" --clobber
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${appimage}"
          jq --arg sig "$(cat "$out/$appimage.sig")" --arg url "$url" \
            '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' \
            "$out/latest.json" > "$out/latest.json.new"
          mv "$out/latest.json.new" "$out/latest.json"
          node tools/release-assets.mjs upload "$out/latest.json"

      - name: Check Linux updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          check="$RUNNER_TEMP/dotx-linux-check"
          mkdir -p "$check"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$check"
          python3 - "$check/latest.json" <<'PY'
          import base64, json, re, sys
          meta = json.load(open(sys.argv[1]))
          config = json.load(open("src-tauri/tauri.conf.json"))
          for platform in ("windows-x86_64", "linux-x86_64"):
              if not meta["platforms"].get(platform, {}).get("signature"):
                  sys.exit(f"latest.json has no {platform} signature")
          def key_line(b64, minimum):
              text = base64.b64decode(b64).decode()
              return next(l for l in text.splitlines() if re.fullmatch(r"[A-Za-z0-9+/=]{%d,}" % minimum, l))
          public = base64.b64decode(key_line(config["plugins"]["updater"]["pubkey"], 40))
          signature = base64.b64decode(key_line(meta["platforms"]["linux-x86_64"]["signature"], 80))
          if public[2:10] != signature[2:10]:
              sys.exit("Linux updater signature key does not match the public key bundled with Dot X")
          PY
          asset=$(basename "$(jq -r '.platforms["linux-x86_64"].url' "$check/latest.json")")
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qxF "$asset" \
            || { echo "::error::$asset is missing from the draft release"; exit 1; }

  publish-beta:
    name: Publish beta after both platform builds pass
    if: inputs.publish_prerelease
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish as prerelease without changing latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BETA_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          printf 'Automated beta from main commit %s.\n\n<!-- dotx-beta-source:%s -->\n' "$BETA_SOURCE_SHA" "$BETA_SOURCE_SHA" > "$RUNNER_TEMP/beta-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file "$RUNNER_TEMP/beta-notes.md"
