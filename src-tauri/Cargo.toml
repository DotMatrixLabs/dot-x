[package]
name = "dot_x"
version = "1.2.3"
description = "Dot X"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
rustc_version = "0.4"

[dependencies]
tauri = { version = "2.8.5", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
tauri-plugin-aptabase = "1.0.0"
serde_json = "1.0"
winreg = "0.52.0"
installed = "0.1.0"
thiserror = "2.0.3"
tauri-plugin-store = { version = "2.1.0" }
tauri-plugin-autostart = { version = "2.0.1" }
windows-volume-control = { git = "https://github.com/Frogbyte-io/windows-volume-control.git", branch = "use-local-language-to-get-process-names" }
#windows-volume-control = { path = "../../windows-volume-control" }
serialport = "4.2.2"
tracing-subscriber = "0.3.17"
tracing = "0.1.39"
clap = "4.5.21"
rmp-serde = "1.1.2"
tauri-plugin-single-instance = { version = "2" }
midir = "0.10.0"
window-vibrancy = "0.5.2"
window-shadows = "0.2.2"
once_cell = "1.18.0"
sentry = "0.42"
tauri-plugin-sentry = "0.5"
log = { version = "^0.4", features = ["max_level_debug", "release_max_level_warn"] }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
active-win-pos-rs = "0.8.3"
cargo-license = "0.6.1"
lazy_static = "1.4.0"
tauri-plugin-fs = "2"
gtk = "0.18"
tauri-plugin-cli = "2.0.1"
tauri-plugin-dialog = "2.0.3"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
chrono = "0.4"
brightness = "0.5.0"
futures = "0.3.31"
psp = { git = "https://github.com/Frogbyte-io/psp" }
#psp = { path = "../../psp" }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
