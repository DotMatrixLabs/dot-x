[package]
name = "dot_x"
version = "1.0.8"
description = "Dot X"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
rustc_version = "0.4"

[dependencies]
tauri = { version = "1.5", features = [ "fs-all", "dialog-all", "shell-open", "cli", "updater", "os-all", "window-all", "notification-all", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
tauri-plugin-aptabase = "0.4"
serde_json = "1.0"
winreg = "0.51.0"
installed = "0.1.0"
thiserror = "1.0.49"
tauri-plugin-store = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
windows-volume-control = { git = "https://github.com/Frogbyte-io/windows-volume-control.git" }
#windows-volume-control = { path = "../../windows-volume-control" }
serialport = "4.2.2"
firmata-rs = "0.4.1"
tracing-subscriber = "0.3.17"
tracing = "0.1.39"
clap = "4.4.7"
rmp-serde = "1.1.2"
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
midir = "0.9.1"
window-vibrancy = "0.4.2"
window-shadows = "0.2.2"
once_cell = "1.18.0"
sentry-tauri = "0.3.0"
log = { version = "^0.4", features = ["max_level_debug", "release_max_level_warn"] }
tauri-plugin-log = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }
active-win-pos-rs = "0.8.3"
cargo-license = "0.6.1"
lazy_static = "1.4.0"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
