[package]
name = "dot_x"
version = "1.2.3"
description = "Dot X"
authors = ["you"]
license = ""
repository = ""
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri = { version = "2.9.2", features = ["tray-icon"] } #TODO: Are features needed?
serde = { version = "1.0", features = ["derive"] }
tauri-plugin-aptabase = "1.0.0"
serde_json = "1.0"
installed = { git = "https://github.com/Frogbyte-io/installed-rs.git", branch = "linux-support" }
thiserror = "2.0.3"
tauri-plugin-store = { version = "2.1.0" }
tauri-plugin-autostart = { version = "2.0.1" }
volume-control-rs = { path = "../../volume-control-rs" }
serialport = "=4.3.0" # locked to 4.3.0 due to slow reading of data on higher versions. TODO: investigate
tracing-subscriber = "0.3.17"
tracing = "0.1.39"
clap = "4.5.49"
rmp-serde = "1.1.2"
tauri-plugin-single-instance = { version = "2" }
midir = "0.10.0"
once_cell = "1.18.0"
sentry = "0.42"
tauri-plugin-sentry = "0.5"
log = { version = "^0.4", features = ["max_level_debug", "release_max_level_warn"] }
socketioxide = "0.16.3"
axum = "0.7"
futures-util = "0.3"
tauri-plugin-log = { version = "2" }
active-win-pos-rs = "0.11.0"
cargo-license = "0.7.0"
lazy_static = "1.4.0"
tauri-plugin-fs = "2"
tauri-plugin-cli = "2.0.1"
tauri-plugin-dialog = "2.0.3"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
chrono = "0.4"
brightness = { git = "https://github.com/Frogbyte-io/brightness.git" }
futures = "0.3.31"
psp = { git = "https://github.com/Frogbyte-io/psp" }
base64ct = "=1.7.1"
zip = "=0.6.6"
tauri-plugin-process = "2"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"
tauri-plugin-mcp-bridge = "0.11"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
tauri-plugin-updater = "2"

# Windows/macOS window effects (Mica/blur/vibrancy). No Linux equivalent is wired
# up yet, and these crates don't build on Linux, so they're excluded there.
# See LINUX-SUPPORT.md for the KDE-blur follow-up.
[target.'cfg(not(target_os = "linux"))'.dependencies]
window-vibrancy = "0.5.2"
window-shadows = "0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-nvidia-quirk = "1.3.0"
