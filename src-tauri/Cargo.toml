[package]
name = "dot_x"
version = "2.0.0-1"
description = "Dot X"
authors = ["Frogbyte AS"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Frogbyte-io/dot-x"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }
rustc_version = "0.4"

[dependencies]
tauri = { version = "2.9.2", features = ["tray-icon"] } #TODO: Are features needed?
serde = { version = "1.0", features = ["derive"] }
tauri-plugin-aptabase = "1.0.0"
serde_json = "1.0"
winreg = "0.52.0"
installed = "0.1.0"
thiserror = "2.0.3"
tauri-plugin-store = { version = "2.1.0" }
tauri-plugin-autostart = { version = "2.0.1" }
windows-volume-control = { git = "https://github.com/Frogbyte-io/windows-volume-control.git", branch = "use-local-language-to-get-process-names" }
windows-sys = { version = "0.48", features = ["Win32_System_Com"] }
serialport = "=4.3.0" # locked to 4.3.0 due to slow reading of data on higher versions. TODO: investigate
tracing-subscriber = "0.3.17"
tracing = "0.1.39"
clap = "4.5.49"
rmp-serde = "1.1.2"
tauri-plugin-single-instance = { version = "2" }
midir = "0.10.0"
window-vibrancy = "0.5.2"
window-shadows = "0.2.2"
once_cell = "1.18.0"
sentry = "0.42"
tauri-plugin-sentry = { version = "0.5", default-features = false } # drops the default `minidump` feature; see Telemetry in README.md
log = { version = "^0.4", features = ["max_level_debug", "release_max_level_warn"] }
socketioxide = "0.16.3"
axum = "0.7"
futures-util = "0.3"
tauri-plugin-log = { version = "2" }
active-win-pos-rs = "0.9.1"
lazy_static = "1.4.0"
tauri-plugin-fs = "2"
tauri-plugin-cli = "2.0.1"
tauri-plugin-dialog = "2.0.3"
tauri-plugin-os = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
chrono = "0.4"
brightness = "0.8.0"
futures = "0.3.31"
psp = { git = "https://github.com/Frogbyte-io/psp" }
base64ct = "=1.7.1"
zip = "=0.6.6"
tauri-plugin-process = "2"
tokio = { version = "1.45", features = ["full"] }
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", features = ["blocking", "json"] }
sha2 = "0.10"
hex = "0.4"
semver = "1"


[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"
tauri-plugin-updater = "2"
